name: Build ConvertFlow Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ConvertFlow-Windows.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/ConvertFlow-macOS-*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ConvertFlow-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ConvertFlow-Android.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO
      - run: cd ios-build/Build/Products/Release-iphonesimulator && zip -r "$GITHUB_WORKSPACE/ConvertFlow-iOS-Simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ConvertFlow-iOS-Simulator.zip
          if-no-files-found: error

  release:
    if: ${{ always() && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' }}
    needs: [windows, macos, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: macos
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: android
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ios
          path: release
          merge-multiple: true
      - name: Verify release files
        run: |
          ls -lah release
          test -f release/ConvertFlow-Windows.exe
          test -f release/ConvertFlow-Android.apk
          test -f release/ConvertFlow-iOS-Simulator.zip
          test -n "$(find release -name '*.dmg' -print -quit)"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event_name == 'workflow_dispatch' && 'manual' || github.run_number }}
          name: ConvertFlow ${{ github.event_name == 'workflow_dispatch' && 'Manual Build' || format('Build {0}', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          files: release/*
