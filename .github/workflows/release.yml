name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.0.2

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/ConvertFlow-Android.apk
          ls -lh release/ConvertFlow-Android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConvertFlow-Android
          path: release/ConvertFlow-Android.apk
          if-no-files-found: error

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ConvertFlow 1.0.2 Android
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: release/ConvertFlow-Android.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
