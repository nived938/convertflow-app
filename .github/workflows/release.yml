name: Build and Release ConvertFlow

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build signed iOS IPA (requires Apple signing secrets)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  APP_VERSION: ${{ github.ref_name }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip flet
      - name: Build Windows app
        run: flet build windows --yes --build-version 1.0.0 --artifact ConvertFlow
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build Windows setup EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build/installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\ConvertFlow.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertFlow-Windows
          path: build/installer/ConvertFlow-Windows.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip flet
      - name: Build Android APK
        run: flet build apk --yes --build-version 1.0.0 --artifact ConvertFlow
      - name: Locate APK
        shell: bash
        run: |
          mkdir -p release
          APK=$(find build/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" release/ConvertFlow-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertFlow-Android
          path: release/ConvertFlow-Android.apk
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip flet
      - name: Build macOS app
        run: flet build macos --yes --build-version 1.0.0 --artifact ConvertFlow
      - name: Create DMG
        shell: bash
        run: |
          mkdir -p release
          APP=$(find build/macos -maxdepth 2 -name 'ConvertFlow.app' -type d | head -n 1)
          test -d "$APP"
          hdiutil create -volname "ConvertFlow" -srcfolder "$APP" -ov -format UDZO release/ConvertFlow-Mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertFlow-Mac
          path: release/ConvertFlow-Mac.dmg
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [windows, android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          cp release-assets/ConvertFlow-Windows/ConvertFlow-Windows.exe release/
          cp release-assets/ConvertFlow-Android/ConvertFlow-Android.apk release/
          cp release-assets/ConvertFlow-Mac/ConvertFlow-Mac.dmg release/
          ls -lh release
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ConvertFlow ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/ConvertFlow-Windows.exe
            release/ConvertFlow-Android.apk
            release/ConvertFlow-Mac.dmg

  ios:
    name: Signed iOS IPA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios == true }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip flet
      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          test -n "$APPLE_CERTIFICATE_BASE64" || (echo "Missing APPLE_CERTIFICATE_BASE64" && exit 1)
          test -n "$APPLE_CERTIFICATE_PASSWORD" || (echo "Missing APPLE_CERTIFICATE_PASSWORD" && exit 1)
          test -n "$IOS_PROVISION_PROFILE_BASE64" || (echo "Missing IOS_PROVISION_PROFILE_BASE64" && exit 1)
          CERT="$RUNNER_TEMP/certificate.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p "ci" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "ci" "$RUNNER_TEMP/build.keychain"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/build.keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/convertflow.mobileprovision"
      - name: Build iOS IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_CERTIFICATE: ${{ secrets.IOS_SIGNING_CERTIFICATE }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          test -n "$IOS_TEAM_ID" || (echo "Missing IOS_TEAM_ID" && exit 1)
          test -n "$IOS_SIGNING_CERTIFICATE" || (echo "Missing IOS_SIGNING_CERTIFICATE" && exit 1)
          test -n "$IOS_PROVISIONING_PROFILE" || (echo "Missing IOS_PROVISIONING_PROFILE" && exit 1)
          flet build ipa --yes --build-version 1.0.0 --artifact ConvertFlow \
            --ios-team-id "$IOS_TEAM_ID" \
            --ios-signing-certificate "$IOS_SIGNING_CERTIFICATE" \
            --ios-provisioning-profile "$IOS_PROVISIONING_PROFILE" \
            --ios-export-method release-testing
      - name: Locate IPA
        shell: bash
        run: |
          mkdir -p release
          IPA=$(find build/ipa -type f -name '*.ipa' | head -n 1)
          test -n "$IPA"
          cp "$IPA" release/ConvertFlow-Ios.ipa
      - name: Upload IPA to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" release/ConvertFlow-Ios.ipa --clobber --repo "${{ github.repository }}"
